[package]
name = "dsh-marina"
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
description = "DSH Marina：为 DSH 管理多个独立实例、插件与整合包，并一键分享到社区"
license = "MIT"
authors = ["Quaon"]
repository = "https://github.com/QuaonY/dsh-marina"
homepage = "https://github.com/QuaonY/dsh-marina"
build = "build.rs"
default-run = "dsh-marina"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
base64 = "0.22"
gpui-kit = "=0.8.1"
gpui-tray = { version = "0.3.0", default-features = false, features = ["gpui-kit", "menu-state"] }
image = { version = "0.25", default-features = false, features = ["png"] }
regex = "1.10"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "gzip", "native-tls", "json"] }
rfd = { version = "0.15.4", default-features = false, features = ["common-controls-v6"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["time"] }
toml = "0.8"
trash = "5"
uuid = { version = "1", features = ["v4"] }
raw-window-handle = "=0.6.2"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Registry", "Win32_System_JobObjects", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[build-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }

[dev-dependencies]
tempfile = "3"
