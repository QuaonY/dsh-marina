[package]
name = "xtask"
version = "0.0.0"
edition = "2024"
publish = false
description = "DSH Marina 发布工具：本机打包、minisign 签名、SHA-256 校验与更新清单组装"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
cargo-packager = "0.11.8"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"

[dev-dependencies]
tempfile = "3"